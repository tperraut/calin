[package]
name = "calin-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "calin"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
calin-auth = { version = "0.0.1", path = "../calin-auth" }
calin-agents = { version = "0.0.1", path = "../calin-agents" }
calin-core = { version = "0.0.1", path = "../calin-core" }
calin-server = { version = "0.0.1", path = "../calin-server" }
clap = { version = "4.6.10", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
