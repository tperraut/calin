[package]
name = "calin-agents"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
calin-proto = { version = "0.0.1", path = "../calin-proto" }
# Plain HTTP to Calin's own tool endpoint on loopback, for the mock's demo
# directives. No TLS: nothing else is ever called.
http-body-util = "0.1.5"
hyper = { version = "1.13.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "time", "rt", "macros", "process", "io-util", "net"] }
tracing = "0.1.44"

# Process groups: an agent is killed together with the tools it spawned.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["process"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
