[package]
name = "calin-install"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# HTTPS for `check` as calin-auth does it: hyper over rustls on the `ring`
# provider with the webpki-roots, so no OpenSSL, aws-lc or CMake. Keep default
# features off on hyper-rustls and rustls.
bytes = "1.12.2"
http-body-util = "0.1.5"
hyper = { version = "1.13.0", features = ["client", "http1"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["ring", "http1", "tls12"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "rt", "time"] }
webpki-roots = "1.0.12"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
