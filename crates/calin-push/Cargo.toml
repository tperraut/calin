[package]
name = "calin-push"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.23.1"
bytes = "1.12.2"
calin-proto = { version = "0.0.1", path = "../calin-proto" }
http-body-util = "0.1.5"
hyper = { version = "1.13.0", features = ["client", "http1"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["ring", "http1", "tls12"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
# Only for the `test-service` feature: a fake device's key agreement, which
# `ring` cannot do with a key it did not generate for one use.
p256 = { version = "0.14.0", features = ["ecdh"], optional = true }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "rt", "time"] }
tower-service = "0.3.3"
tracing = "0.1.44"
url = "2.5.9"
webpki-roots = "1.0.12"

[features]
# Exposes the fake push service of the tests (`test_service`) to the tests of
# other crates. Off by default: nothing in the `calin` binary enables it.
test-service = ["dep:p256", "tokio/net", "tokio/io-util"]

[lints]
workspace = true

[dev-dependencies]
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
