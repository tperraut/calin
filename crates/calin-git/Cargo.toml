[package]
name = "calin-git"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
calin-proto = { version = "0.0.1", path = "../calin-proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
thiserror = "2.0.21"

# Process groups: a setup command is killed together with what it started.
# Open flags: a file is hashed without following a link or blocking on a pipe.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs", "process"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
