[package]
name = "calin-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "original-uri", "tokio", "ws"] }
calin-agents = { version = "0.0.1", path = "../calin-agents" }
calin-core = { version = "0.0.1", path = "../calin-core" }
calin-proto = { version = "0.0.1", path = "../calin-proto" }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["sync", "time", "rt", "macros", "net"] }
tokio-util = "0.7.20"
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
